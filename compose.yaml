services:
  opencode2api:
    build:
      context: .
      dockerfile: Dockerfile
    image: opencode2api:local
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      - PORT=${PORT:-8080}
      - CONFIG_PATH
      - STATE_DIR
      - LISTEN_ADDRESS
      - WEBUI_LISTEN_ADDRESS
      - OPENCODE2API_SERVER_KEYS
      - OPENCODE2API_ZEN_KEYS
      - OPENCODE2API_GO_KEYS
      - OPENCODE2API_WEBUI_USERNAME
      - OPENCODE2API_WEBUI_PASSWORD
      - OPENCODE2API_WEBUI_ENABLED
    ports:
      - "${OPENCODE2API_PORT:-8080}:${PORT:-8080}"
    volumes:
      - opencode2api-state:/var/lib/opencode2api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${PORT:-8080}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  opencode2api-state:
